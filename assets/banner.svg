<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Node Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .pulse-node {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .pulse-node-2 {
        animation: pulse 3.5s ease-in-out 0.8s infinite alternate;
      }
      .pulse-node-3 {
        animation: pulse 4s ease-in-out 1.5s infinite alternate;
      }
      .flow-line-1 {
        stroke-dasharray: 8, 12;
        animation: dash 12s linear infinite;
      }
      .flow-line-2 {
        stroke-dasharray: 6, 10;
        animation: dashReverse 15s linear infinite;
      }
      .flow-line-3 {
        stroke-dasharray: 10, 14;
        animation: dash 18s linear infinite;
      }
      .glow-particle {
        animation: particleGlow 2.5s ease-in-out infinite alternate;
      }
      .tagline-fade {
        animation: textGlow 4s ease-in-out infinite alternate;
      }

      @keyframes dash {
        to {
          stroke-dashoffset: -200;
        }
      }
      @keyframes dashReverse {
        to {
          stroke-dashoffset: 200;
        }
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.9)); }
      }
      @keyframes particleGlow {
        0% { r: 3; opacity: 0.4; }
        100% { r: 5.5; opacity: 1; }
      }
      @keyframes textGlow {
        0% { opacity: 0.85; }
        100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.6)); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="280" x2="1200" y2="280" />

    <line x1="100" y1="0" x2="100" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="500" y1="0" x2="500" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
    <line x1="1100" y1="0" x2="1100" y2="320" />
  </g>

  <!-- Pipeline Network Connections (Data Flow DAG) -->
  <g fill="none" stroke-linecap="round">
    <!-- Curved Pipeline Lines -->
    <path d="M 80,160 C 200,60 300,100 450,80" stroke="url(#cyanGrad)" stroke-width="2.5" opacity="0.6" class="flow-line-1" />
    <path d="M 450,80 C 600,60 700,140 850,90" stroke="url(#primaryGrad)" stroke-width="2.5" opacity="0.7" class="flow-line-2" />
    <path d="M 850,90 C 950,50 1050,110 1140,70" stroke="url(#amberGrad)" stroke-width="2.5" opacity="0.6" class="flow-line-1" />

    <path d="M 80,220 C 250,260 380,180 520,240" stroke="url(#emeraldGrad)" stroke-width="2" opacity="0.5" class="flow-line-2" />
    <path d="M 520,240 C 680,290 820,200 960,250" stroke="url(#cyanGrad)" stroke-width="2.5" opacity="0.6" class="flow-line-3" />
    <path d="M 960,250 C 1040,280 1100,230 1150,260" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.5" class="flow-line-1" />

    <!-- Cross DAG Branching Lines -->
    <path d="M 450,80 C 480,150 490,190 520,240" stroke="#8b5cf6" stroke-width="1.8" opacity="0.4" class="flow-line-3" />
    <path d="M 850,90 C 880,160 920,200 960,250" stroke="#ec4899" stroke-width="1.8" opacity="0.4" class="flow-line-2" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="100" r="80" fill="#6366f1" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="1000" cy="220" r="100" fill="#ec4899" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="600" cy="160" r="120" fill="#06b6d4" opacity="0.05" filter="url(#softGlow)" />

  <!-- DAG Orchestration Nodes -->
  <g filter="url(#glow)">
    <!-- Node 1: Ingest -->
    <circle cx="80" cy="160" r="10" fill="#06b6d4" class="pulse-node" />
    <circle cx="80" cy="160" r="4" fill="#ffffff" />

    <!-- Node 2: Transform -->
    <circle cx="450" cy="80" r="11" fill="#8b5cf6" class="pulse-node-2" />
    <circle cx="450" cy="80" r="5" fill="#ffffff" />

    <!-- Node 3: Orchestrate -->
    <circle cx="850" cy="90" r="12" fill="#ec4899" class="pulse-node" />
    <circle cx="850" cy="90" r="5" fill="#ffffff" />

    <!-- Node 4: Publish -->
    <circle cx="1140" cy="70" r="10" fill="#f59e0b" class="pulse-node-3" />
    <circle cx="1140" cy="70" r="4" fill="#ffffff" />

    <!-- Bottom Stream Nodes -->
    <circle cx="80" cy="220" r="9" fill="#10b981" class="pulse-node-3" />
    <circle cx="520" cy="240" r="11" fill="#06b6d4" class="pulse-node" />
    <circle cx="960" cy="250" r="12" fill="#8b5cf6" class="pulse-node-2" />
    <circle cx="1150" cy="260" r="9" fill="#ec4899" class="pulse-node-3" />
  </g>

  <!-- Glowing Dynamic Particles -->
  <circle cx="280" cy="100" r="4" fill="#06b6d4" class="glow-particle" />
  <circle cx="680" cy="110" r="4.5" fill="#a855f7" class="glow-particle" />
  <circle cx="1020" cy="85" r="3.5" fill="#f59e0b" class="glow-particle" />
  <circle cx="340" cy="215" r="4" fill="#10b981" class="glow-particle" />
  <circle cx="780" cy="235" r="4.5" fill="#38bdf8" class="glow-particle" />

  <!-- Center Typography & Branding -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Category Badge -->
    <rect x="420" y="52" width="360" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
    <text x="600" y="71" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="2.5">
      🚀 AWESOME ECOSYSTEM DIRECTORY
    </text>

    <!-- Main Title -->
    <text x="600" y="142" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5" filter="url(#glow)">
      Data Orchestration Platforms
    </text>

    <!-- Gradient Subtitle / Tagline -->
    <text x="600" y="185" font-size="17" font-weight="600" fill="url(#primaryGrad)" letter-spacing="0.5" class="tagline-fade">
      ⚡ Workflow Engines • Data Pipelines • Durable Execution • Event-Driven Automation
    </text>

    <!-- Feature Pills -->
    <g transform="translate(600, 235)" font-size="12" font-weight="600">
      <!-- Pill 1 -->
      <g transform="translate(-250, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="0" y="5" fill="#93c5fd">🏢 SaaS &amp; Cloud</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="0" y="5" fill="#c4b5fd">🌟 Open Source</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(90, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="0" y="5" fill="#6ee7b7">🤖 ML / AI Workflows</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(255, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="0" y="5" fill="#fcd34d">📊 Real-Time Pricing</text>
      </g>
    </g>
  </g>
</svg>
